<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4;
    background: {{ c.bg }};
    margin: 16mm 14mm 17mm 14mm;
    @bottom-right {
      content: "{{ footer.generated_at }} · {{ footer.app_name }} · Seite " counter(page) "/" counter(pages);
      font-family: "DejaVu Sans", Arial, sans-serif; font-size: 7.5pt; color: {{ c.muted }};
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "DejaVu Sans", Arial, sans-serif;
    background: {{ c.bg }}; color: {{ c.ink }};
    font-size: 9.7pt; line-height: 1.5;
  }
  a { color: {{ c.ink_strong }}; text-decoration: none; }
  .sheet { background: {{ c.panel }}; border: 1px solid {{ c.line }}; padding: 10mm 10mm 9mm; }
  /* Kopf */
  .doc-head { border-bottom: 2px solid {{ c.accent }}; padding-bottom: 6mm; margin-bottom: 7mm; }
  .brand-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5mm; }
  .brand { font-size: 8pt; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: {{ c.ink_strong }}; }
  .brand .mark { width: 16px; height: 16px; border: 1px solid {{ c.line_strong }}; }
  .brand .muted { color: {{ c.muted }}; font-weight: 600; letter-spacing: .1em; }
  h1 { font-size: 18pt; font-weight: 800; letter-spacing: -.02em; margin: 0; color: {{ c.ink_strong }}; }
  .micro { font-size: 7.5pt; text-transform: uppercase; letter-spacing: .12em; color: {{ c.muted }}; font-weight: 700; }
  .subtitle { color: {{ c.muted }}; margin: 2mm 0 0; font-size: 10pt; }
  /* Karten */
  .card { background: {{ c.panel }}; border: 1px solid {{ c.line }}; padding: 6mm; margin: 0 0 5mm; }
  .card h2 { font-size: 8pt; text-transform: uppercase; letter-spacing: .1em; color: {{ c.muted }}; font-weight: 700; margin: 0 0 4mm; }
  .grid { display: flex; gap: 4mm; margin-bottom: 5mm; }
  .grid > * { flex: 1; }
  .stat { position: relative; border: 1px solid {{ c.line }}; background: {{ c.panel }}; padding: 4mm 4mm 4mm 5mm; }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sc, {{ c.accent }}); }
  .stat .num { font-size: 20pt; font-weight: 800; letter-spacing: -.03em; color: var(--sc, {{ c.ink_strong }}); }
  .stat .lbl { color: {{ c.muted }}; font-size: 7.5pt; margin-top: .5mm; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .stat .sub { font-size: 7.5pt; margin-top: 1mm; color: {{ c.muted }}; }
  h2.sec { font-size: 11pt; font-weight: 700; letter-spacing: -.01em; margin: 0 0 3mm; color: {{ c.ink_strong }}; border-bottom: 1px solid {{ c.line }}; padding-bottom: 1.5mm; }
  .two { display: flex; gap: 4mm; margin-bottom: 5mm; }
  .two > * { flex: 1; min-width: 0; }
  /* Tabellen */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 7pt; text-transform: uppercase; letter-spacing: .08em; color: {{ c.muted }}; font-weight: 700; background: {{ c.panel2 }}; padding: 2.2mm 2mm; border-bottom: 1px solid {{ c.line }}; }
  td { padding: 2.2mm 2mm; border-bottom: 1px solid {{ c.line }}; vertical-align: top; font-size: 8.6pt; }
  table.apps { table-layout: fixed; }
  table.apps td { font-size: 8pt; padding: 2.1mm 1.9mm; word-wrap: break-word; line-height: 1.4; }
  table.apps th { padding: 2mm 1.9mm; font-size: 6.8pt; white-space: nowrap; overflow: hidden; }
  .link-cell { white-space: nowrap; }
  table.apps tr:nth-child(even) td { background: {{ c.panel2 }}; }
  .badge { display: inline-block; padding: .7mm 1.8mm; font-size: 6.9pt; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; border: 1px solid var(--bc); color: var(--bc); }
  .date-cell { white-space: nowrap; color: {{ c.muted }}; }
  .co { font-weight: 700; color: {{ c.ink_strong }}; }
  /* Diagramme */
  .donut-wrap { display: table; width: 100%; }
  .donut-wrap svg.donut-svg { display: table-cell; width: 116px; vertical-align: middle; }
  .donut-svg { flex: none; }
  .donut-num { font-size: 20px; font-weight: 800; fill: {{ c.ink_strong }}; }
  .donut-lbl { font-size: 7px; font-weight: 700; fill: {{ c.muted }}; letter-spacing: .05em; }
  table.legend { display: table-cell; width: 100%; border-collapse: collapse; vertical-align: middle; padding-left: 5mm; }
  .donut-stack { display: block; text-align: center; }
  .donut-stack svg.donut-svg { display: block; margin: 0 auto 3mm; }
  table.legend-stacked { display: table; width: 100%; padding-left: 0; }
  table.legend td { border: 0; background: none; padding: .5mm 0; font-size: 7.3pt; }
  .lg-dot { width: 4.5mm; }
  .dot { width: 7px; height: 7px; display: inline-block; }
  .lg-lbl { white-space: normal; word-wrap: break-word; padding-right: 1.5mm; }
  .lg-pct { text-align: right; width: 10mm; color: {{ c.muted }}; }
  .lg-n { text-align: right; width: 7mm; font-weight: 700; }
  table.bars { width: 100%; border-collapse: collapse; }
  table.bars td { border: 0; background: none; padding: .7mm 0; vertical-align: middle; }
  .bar-label { width: 24mm; color: {{ c.muted }}; font-size: 8.4pt; }
  td.bar { background: {{ c.track }}; height: 2.6mm; }
  .bar-fill { display: block; height: 2.6mm; }
  .bar-num { width: 8mm; text-align: right; font-weight: 700; font-size: 8.4pt; }
  table.funnel { width: 100%; border-collapse: collapse; }
  table.funnel td { border: 0; background: none; padding: 1.1mm 0; vertical-align: middle; }
  .funnel-label { width: 28mm; font-size: 8.4pt; color: {{ c.ink }}; }
  .funnel-bar { display: inline-block; height: 6mm; line-height: 6mm; color: #fff; padding: 0 2.5mm; font-weight: 700; font-size: 8pt; white-space: nowrap; min-width: 9mm; }
  .funnel-bar b { margin-left: 2mm; }
  .funnel-pct { width: 11mm; text-align: right; color: {{ c.muted }}; font-size: 8.4pt; }
  .chart-svg .grid { stroke: {{ c.line }}; stroke-width: 1; }
  .chart-svg .axis { fill: {{ c.muted }}; font-size: 8px; }
  .chart-svg .axis.y { text-anchor: end; }
  .chart-svg .axis.x { text-anchor: middle; }
  .chart-svg .dot-a { fill: {{ c.accent }}; }
  .muted { color: {{ c.muted }}; }
  .small { font-size: 7.6pt; }
  .meta-line { display: flex; flex-wrap: wrap; gap: 2mm 6mm; color: {{ c.muted }}; font-size: 8pt; margin-top: 2mm; }
  .note { font-size: 7.5pt; color: {{ c.muted }}; margin-top: 3mm; }
  /* Fusszeile */
  .pdf-foot { margin-top: 8mm; border-top: 1px solid {{ c.line }}; padding-top: 3mm; font-size: 7.6pt; color: {{ c.muted }}; }
  .pdf-foot .accent { color: {{ c.accent }}; font-weight: 700; }
  .letter-body p { margin: 0 0 3mm; }
  .letter-body h1, .letter-body h2, .letter-body h3 { font-size: 11pt; margin: 4mm 0 2mm; }
  .letter-body ul, .letter-body ol { margin: 0 0 3mm 5mm; padding: 0; }
  .letter-body blockquote { margin: 0 0 3mm; padding-left: 3mm; border-left: 2px solid {{ c.accent }}; color: {{ c.muted }}; }
  .photo { float: right; width: 30mm; margin: 0 0 4mm 6mm; border: 1px solid {{ c.line }}; }
</style>
</head>
<body>
<div class="sheet">
  <div class="doc-head">
    <div class="brand-row">
      <span class="brand">{{ footer.app_name }}</span>
      <span class="micro">· {{ footer.author }}</span>
    </div>
    <h1>{{ title }}</h1>
    {% if subtitle %}<p class="subtitle">{{ subtitle }}</p>{% endif %}
    {% block headmeta %}{% endblock %}
  </div>
  {% block content %}{% endblock %}
  <div class="pdf-foot">
    <span class="accent">{{ footer.credit }}</span> ·
    <a href="{{ footer.github_url }}">{{ footer.github_url }}</a> ·
    {{ footer.author }} · {{ footer.generated_at }}
  </div>
</div>
</body>
</html>
