{% extends "base.html" %}
{% set page_title = t('crop.title') %}
{% block content %}
<h1>{{ t('crop.title') }}</h1>
<p class="subtitle">{{ doc.name }} · {{ t('crop.subtitle') }}</p>

<div class="crop-layout">
  <div>
    <div id="frame" class="crop-frame"><canvas id="cimg"></canvas></div>
  </div>
  <div class="crop-side">
    <div class="field"><label>{{ t('crop.rotate') }} <span id="rotval" class="muted">0°</span></label>
      <input type="range" id="rot" min="-20" max="20" step="0.5" value="0"></div>
    <div class="field"><label>{{ t('crop.brightness') }} <span id="brightval" class="muted">100%</span></label>
      <input type="range" id="bright" min="50" max="150" step="1" value="100"></div>
    <div class="field"><label>{{ t('crop.contrast') }} <span id="contrastval" class="muted">100%</span></label>
      <input type="range" id="contrast" min="50" max="150" step="1" value="100"></div>
    <div class="field"><label>{{ t('crop.zoom') }} <span id="zoomval" class="muted">100%</span></label>
      <input type="range" id="zoom" min="100" max="300" step="1" value="100"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-primary" type="button" onclick="mbCropSave()">{{ t('common.save') }}</button>
      <a class="btn" href="/documents">{{ t('common.cancel') }}</a>
    </div>
  </div>
</div>

<form id="cropform" method="post" action="/documents/{{ doc.id }}/crop" style="display:none">
  <input type="hidden" name="x" id="cx"><input type="hidden" name="y" id="cy">
  <input type="hidden" name="w" id="cw"><input type="hidden" name="h" id="ch">
  <input type="hidden" name="rotate" id="crot" value="0">
  <input type="hidden" name="brightness" id="cbright" value="1">
  <input type="hidden" name="contrast" id="ccontrast" value="1">
</form>

<style>
.crop-layout { display: flex; gap: 28px; flex-wrap: wrap; }
.crop-frame { position: relative; width: 315px; height: 405px; overflow: hidden; border: 2px solid var(--accent);
  border-radius: 4px; background: #111; cursor: grab; touch-action: none; }
.crop-frame.dragging { cursor: grabbing; }
.crop-frame canvas { position: absolute; user-select: none; }
.crop-side { min-width: 260px; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
</style>

<script>
(function () {
  const Fw = 315, Fh = 405;
  const frame = document.getElementById("frame");
  const canvas = document.getElementById("cimg");
  const rotEl = document.getElementById("rot");
  const brightEl = document.getElementById("bright");
  const contrastEl = document.getElementById("contrast");
  const zoomEl = document.getElementById("zoom");
  const src = new Image();
  let natW = 0, natH = 0, base = 1, scale = 1, dx = 0, dy = 0, rot = 0;

  function rotDims(w, h, deg) {
    const r = deg * Math.PI / 180;
    const c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
    return [Math.ceil(w * c + h * s), Math.ceil(w * s + h * c)];
  }
  function draw() {
    const d = rotDims(src.naturalWidth, src.naturalHeight, rot);
    natW = d[0]; natH = d[1];
    canvas.width = natW; canvas.height = natH;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, natW, natH);
    ctx.save();
    ctx.translate(natW / 2, natH / 2);
    ctx.rotate(-rot * Math.PI / 180);
    ctx.drawImage(src, -src.naturalWidth / 2, -src.naturalHeight / 2);
    ctx.restore();
    applyFilters();
  }
  function applyFilters() {
    canvas.style.filter = "brightness(" + (parseInt(brightEl.value, 10) / 100) +
      ") contrast(" + (parseInt(contrastEl.value, 10) / 100) + ")";
  }
  function fit() {
    base = Math.max(Fw / natW, Fh / natH);
    scale = base * (parseInt(zoomEl.value, 10) / 100);
    dx = (Fw - natW * scale) / 2;
    dy = (Fh - natH * scale) / 2;
    render();
  }
  function clamp() {
    const W = natW * scale, H = natH * scale;
    dx = Math.min(0, Math.max(Fw - W, dx));
    dy = Math.min(0, Math.max(Fh - H, dy));
  }
  function render() {
    clamp();
    canvas.style.width = (natW * scale) + "px";
    canvas.style.height = (natH * scale) + "px";
    canvas.style.left = dx + "px";
    canvas.style.top = dy + "px";
  }
  src.addEventListener("load", function () { draw(); fit(); });
  src.src = "{{ image_url }}";

  frame.addEventListener("pointerdown", function (e) {
    frame.setPointerCapture(e.pointerId);
    frame.classList.add("dragging");
    let sx = e.clientX, sy = e.clientY, ox = dx, oy = dy;
    function move(ev) { dx = ox + (ev.clientX - sx); dy = oy + (ev.clientY - sy); render(); }
    function up() {
      frame.classList.remove("dragging");
      frame.removeEventListener("pointermove", move);
      frame.removeEventListener("pointerup", up);
    }
    frame.addEventListener("pointermove", move);
    frame.addEventListener("pointerup", up);
    e.preventDefault();
  });
  rotEl.addEventListener("input", function () {
    rot = parseFloat(rotEl.value);
    document.getElementById("rotval").textContent = rot + "°";
    draw(); fit();
  });
  brightEl.addEventListener("input", function () {
    document.getElementById("brightval").textContent = brightEl.value + "%"; applyFilters();
  });
  contrastEl.addEventListener("input", function () {
    document.getElementById("contrastval").textContent = contrastEl.value + "%"; applyFilters();
  });
  zoomEl.addEventListener("input", function () {
    document.getElementById("zoomval").textContent = zoomEl.value + "%";
    scale = base * (parseInt(zoomEl.value, 10) / 100); render();
  });
  window.mbCropSave = function () {
    const s = scale;
    let x = Math.round((-dx) / s), y = Math.round((-dy) / s);
    let w = Math.round(Fw / s), h = Math.round(Fh / s);
    x = Math.max(0, Math.min(natW - w, x));
    y = Math.max(0, Math.min(natH - h, y));
    document.getElementById("cx").value = x;
    document.getElementById("cy").value = y;
    document.getElementById("cw").value = w;
    document.getElementById("ch").value = h;
    document.getElementById("crot").value = rot;
    document.getElementById("cbright").value = parseInt(brightEl.value, 10) / 100;
    document.getElementById("ccontrast").value = parseInt(contrastEl.value, 10) / 100;
    document.getElementById("cropform").submit();
  };
})();
</script>
{% endblock %}
